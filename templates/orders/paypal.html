<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pay with PayPal | AakashKart</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 40px 20px;
        }

        .payment-box {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
        }

        .amount {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin: 20px 0;
        }

        #paypal-button-container {
            margin-top: 25px;
        }

        #error-message {
            display: none;
            color: red;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="payment-box">

    <h2>💳 Pay with PayPal</h2>

    <p style="text-align:center;">
        Fast & secure online payment
    </p>

    <div class="amount">
        ₹{{ order.total }}
    </div>

    <div id="paypal-button-container"></div>

    <div id="error-message"></div>

</div>


<!-- ================================================= -->
<!-- PAYPAL SDK -->
<!-- ================================================= -->

<script src="https://www.paypal.com/sdk/js?client-id={{ paypal_client_id }}&currency=USD"></script>


<script>

console.log("PayPal Client ID loaded");


document.addEventListener("DOMContentLoaded", function () {

    console.log("DOM Loaded");


    // ================================================
    // CHECK PAYPAL
    // ================================================

    if (typeof paypal === "undefined") {

        console.error("PayPal SDK NOT loaded");

        showError(
            "PayPal SDK could not be loaded."
        );

        return;
    }


    console.log("PayPal SDK loaded successfully");


    // ================================================
    // PAYPAL BUTTON
    // ================================================

    paypal.Buttons({

        // ============================================
        // CREATE ORDER
        // ============================================

        createOrder: function () {

            console.log(
                "Creating PayPal order..."
            );


            return fetch(
                "{% url 'orders:create_paypal_order' %}",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "X-CSRFToken":
                            getCookie("csrftoken")
                    },

                    body: JSON.stringify({
                        order_id:
                            "{{ order.id }}"
                    })
                }
            )

            .then(function (response) {

                console.log(
                    "Create order status:",
                    response.status
                );

                return response.json();

            })

            .then(function (data) {

                console.log(
                    "Create order response:",
                    data
                );


                if (!data.id) {

                    throw new Error(
                        data.error ||
                        "PayPal order creation failed"
                    );
                }


                return data.id;

            })

            .catch(function (error) {

                console.error(
                    "CREATE ORDER ERROR:",
                    error
                );

                showError(
                    error.message
                );

                throw error;

            });

        },


        // ============================================
        // APPROVE
        // ============================================

        onApprove: function (
            data,
            actions
        ) {

            console.log(
                "PayPal approved:",
                data.orderID
            );


            return fetch(

                `/orders/capture-paypal-order/${data.orderID}/`,

                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "X-CSRFToken":
                            getCookie("csrftoken")
                    }
                }

            )

            .then(function (response) {

                return response.json();

            })

            .then(function (result) {

                console.log(
                    "Capture result:",
                    result
                );


                if (!result.success) {

                    throw new Error(
                        result.error ||
                        "Payment capture failed"
                    );
                }


                window.location.href =
                    result.redirect_url;

            })

            .catch(function (error) {

                console.error(
                    "CAPTURE ERROR:",
                    error
                );

                showError(
                    error.message
                );

            });

        },


        // ============================================
        // CANCEL
        // ============================================

        onCancel: function () {

            console.log(
                "PayPal payment cancelled"
            );

            showError(
                "Payment cancelled."
            );

        },


        // ============================================
        // ERROR
        // ============================================

        onError: function (error) {

            console.error(
                "PAYPAL ERROR:",
                error
            );

            showError(
                "PayPal payment failed. Please try again."
            );

        }

    }).render(
        "#paypal-button-container"
    );


    // ================================================
    // CSRF COOKIE
    // ================================================

    function getCookie(name) {

        let cookieValue = null;

        if (document.cookie) {

            const cookies =
                document.cookie.split(";");

            for (
                let i = 0;
                i < cookies.length;
                i++
            ) {

                const cookie =
                    cookies[i].trim();


                if (
                    cookie.substring(
                        0,
                        name.length + 1
                    ) ===
                    name + "="
                ) {

                    cookieValue =
                        decodeURIComponent(
                            cookie.substring(
                                name.length + 1
                            )
                        );

                    break;
                }
            }
        }

        return cookieValue;
    }


    // ================================================
    // ERROR MESSAGE
    // ================================================

    function showError(message) {

        const error =
            document.getElementById(
                "error-message"
            );

        error.style.display = "block";

        error.innerText = message;
    }

});

</script>

</body>
</html>
