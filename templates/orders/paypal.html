<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pay with PayPal | AakashKart</title>

    <script src="https://www.paypal.com/sdk/js?client-id={{ paypal_client_id }}&currency=USD&intent=capture"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .paypal-wrapper {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .paypal-card {
            width: 100%;
            max-width: 560px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.10);
        }

        .paypal-title {
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .paypal-subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
        }

        .amount {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin: 20px 0 30px;
        }

        #paypal-button-container {
            width: 100%;
        }

        #paypal-error {
            display: none;
            margin-top: 20px;
            padding: 12px;
            background: #ffe5e5;
            color: #d00000;
            border-radius: 8px;
            text-align: center;
            word-break: break-word;
        }

        #paypal-loading {
            text-align: center;
            color: #777;
            margin-bottom: 15px;
        }

    </style>

</head>


<body>

<div class="paypal-wrapper">

    <div class="paypal-card">

        <div class="paypal-title">
            💳 Pay with PayPal
        </div>

        <div class="paypal-subtitle">
            Fast & secure online payment
        </div>

        <div class="amount">
            ₹{{ order.total }}
        </div>

        <div id="paypal-loading">
            Loading PayPal...
        </div>

        <div id="paypal-button-container"></div>

        <div id="paypal-error"></div>

    </div>

</div>


<script>

const djangoOrderId = "{{ order.id }}";

const createUrl =
    "{% url 'orders:create_paypal_order' %}";

const captureBaseUrl =
    "/orders/capture-paypal-order/";


function showError(message) {

    const errorBox =
        document.getElementById(
            "paypal-error"
        );

    errorBox.style.display = "block";

    errorBox.textContent =
        message;

}


function hideLoading() {

    document.getElementById(
        "paypal-loading"
    ).style.display = "none";

}


async function parseJsonResponse(response) {

    const contentType =
        response.headers.get(
            "content-type"
        ) || "";

    const text =
        await response.text();

    console.log(
        "SERVER STATUS:",
        response.status
    );

    console.log(
        "SERVER CONTENT TYPE:",
        contentType
    );

    console.log(
        "SERVER RESPONSE:",
        text
    );

    if (
        !contentType.includes(
            "application/json"
        )
    ) {

        throw new Error(
            "Server returned HTML instead of JSON. " +
            "Check Django URL / deployment logs."
        );
    }

    try {

        return JSON.parse(text);

    } catch (error) {

        throw new Error(
            "Invalid JSON response from server."
        );
    }
}


paypal.Buttons({

    // ========================================================
    // CREATE PAYPAL ORDER
    // ========================================================

    createOrder: async function () {

        console.log(
            "Creating PayPal order..."
        );

        try {

            const response =
                await fetch(
                    createUrl,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json",

                            "X-Requested-With":
                                "XMLHttpRequest"
                        },

                        body: JSON.stringify({

                            order_id:
                                djangoOrderId

                        })
                    }
                );


            const data =
                await parseJsonResponse(
                    response
                );


            console.log(
                "CREATE ORDER DATA:",
                data
            );


            if (
                !response.ok ||
                !data.success
            ) {

                throw new Error(
                    data.error ||
                    "Unable to create PayPal order."
                );
            }


            if (!data.id) {

                throw new Error(
                    "PayPal Order ID was not returned."
                );
            }


            console.log(
                "PayPal Order ID:",
                data.id
            );


            return data.id;

        }

        catch (error) {

            console.error(
                "CREATE ORDER ERROR:",
                error
            );

            showError(
                error.message
            );

            throw error;
        }

    },


    // ========================================================
    // PAYMENT APPROVED
    // ========================================================

    onApprove: async function (
        data
    ) {

        console.log(
            "PAYPAL APPROVED:",
            data
        );


        try {

            const response =
                await fetch(

                    captureBaseUrl +
                    encodeURIComponent(
                        data.orderID
                    ) +
                    "/",

                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json",

                            "X-Requested-With":
                                "XMLHttpRequest"
                        },

                        body: JSON.stringify({

                            paypal_order_id:
                                data.orderID

                        })
                    }
                );


            const result =
                await parseJsonResponse(
                    response
                );


            console.log(
                "CAPTURE RESULT:",
                result
            );


            if (
                !response.ok ||
                !result.success
            ) {

                throw new Error(
                    result.error ||
                    "Payment capture failed."
                );
            }


            // =================================================
            // SUCCESS
            // =================================================

            window.location.href =
                result.redirect_url;

        }

        catch (error) {

            console.error(
                "CAPTURE ERROR:",
                error
            );

            showError(
                error.message
            );
        }

    },


    // ========================================================
    // CANCEL
    // ========================================================

    onCancel: function (
        data
    ) {

        console.log(
            "PAYPAL PAYMENT CANCELLED:",
            data
        );

        showError(
            "Payment was cancelled."
        );
    },


    // ========================================================
    // ERROR
    // ========================================================

    onError: function (
        error
    ) {

        console.error(
            "PAYPAL SDK ERROR:",
            error
        );

        showError(
            "PayPal payment error. Please try again."
        );
    }

}).render(
    "#paypal-button-container"
)
.then(
    function () {

        hideLoading();

        console.log(
            "PayPal button rendered successfully."
        );

    }
)
.catch(
    function (error) {

        hideLoading();

        console.error(
            "PAYPAL RENDER ERROR:",
            error
        );

        showError(
            "Unable to load PayPal."
        );
    }
);

</script>

</body>

</html>
