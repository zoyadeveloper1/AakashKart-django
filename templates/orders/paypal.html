
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pay with PayPal | AakashKart</title>


    <!-- =====================================================
         PAYPAL JAVASCRIPT SDK
    ====================================================== -->

    <script
        src="https://www.paypal.com/sdk/js?client-id={{ paypal_client_id }}&currency=USD&intent=capture">
    </script>


    <!-- =====================================================
         STYLE
    ====================================================== -->

    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            padding: 0;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }


        .paypal-wrapper {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px 15px;
        }


        .paypal-card {

            width: 100%;

            max-width: 560px;

            background: #ffffff;

            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 8px 30px
                rgba(0, 0, 0, 0.10);
        }


        .paypal-title {

            text-align: center;

            font-size: 26px;

            font-weight: bold;

            margin-bottom: 10px;
        }


        .paypal-subtitle {

            text-align: center;

            color: #666;

            margin-bottom: 20px;
        }


        .amount {

            text-align: center;

            font-size: 28px;

            font-weight: bold;

            margin: 20px 0 30px;
        }


        #paypal-button-container {

            width: 100%;
        }


        #paypal-loading {

            text-align: center;

            color: #777;

            margin-bottom: 15px;
        }


        #paypal-error {

            display: none;

            margin-top: 20px;

            padding: 14px;

            background: #ffe5e5;

            color: #d00000;

            border-radius: 8px;

            text-align: center;

            word-break: break-word;

            font-size: 14px;
        }


        .order-info {

            text-align: center;

            color: #777;

            font-size: 14px;

            margin-bottom: 20px;
        }

    </style>

</head>


<body>


<div class="paypal-wrapper">


    <div class="paypal-card">


        <!-- =================================================
             TITLE
        ================================================== -->

        <div class="paypal-title">

            💳 Pay with PayPal

        </div>


        <div class="paypal-subtitle">

            Fast & secure online payment

        </div>


        <!-- =================================================
             ORDER NUMBER
        ================================================== -->

        <div class="order-info">

            Order #{{ order.order_number }}

        </div>


        <!-- =================================================
             TOTAL AMOUNT
        ================================================== -->

        <div class="amount">

            ₹{{ order.total }}

        </div>


        <!-- =================================================
             LOADING
        ================================================== -->

        <div id="paypal-loading">

            Loading PayPal...

        </div>


        <!-- =================================================
             PAYPAL BUTTON
        ================================================== -->

        <div id="paypal-button-container"></div>


        <!-- =================================================
             ERROR
        ================================================== -->

        <div id="paypal-error"></div>


    </div>

</div>



<script>


/* ==========================================================
   DJANGO ORDER ID
========================================================== */

const djangoOrderId =
    "{{ order.id }}";


/* ==========================================================
   CREATE PAYPAL ORDER URL

   Django:

   path(
       "paypal/create/",
       views.create_paypal_order,
       name="create_paypal_order"
   )
========================================================== */

const createUrl =
    "{% url 'orders:create_paypal_order' %}";


/* ==========================================================
   CAPTURE PAYPAL ORDER URL

   Django:

   path(
       "capture-paypal-order/<str:paypal_order_id>/",
       views.capture_paypal_order,
       name="capture_paypal_order"
   )

   We generate the URL with a placeholder and
   replace it with the real PayPal Order ID.
========================================================== */

const captureUrlTemplate =
    "{% url 'orders:capture_paypal_order' paypal_order_id='PAYPAL_ORDER_ID' %}";


/* ==========================================================
   SHOW ERROR
========================================================== */

function showError(message) {

    const errorBox =
        document.getElementById(
            "paypal-error"
        );


    errorBox.style.display =
        "block";


    errorBox.textContent =
        message;
}


/* ==========================================================
   HIDE LOADING
========================================================== */

function hideLoading() {

    const loading =
        document.getElementById(
            "paypal-loading"
        );


    loading.style.display =
        "none";
}


/* ==========================================================
   GET CSRF TOKEN

   Even though the current Django views use
   @csrf_exempt, keeping CSRF support here is
   better for security.
========================================================== */

function getCookie(name) {

    let cookieValue = null;


    if (document.cookie &&
        document.cookie !== "") {

        const cookies =
            document.cookie.split(";");


        for (
            let i = 0;
            i < cookies.length;
            i++
        ) {

            const cookie =
                cookies[i].trim();


            if (
                cookie.substring(
                    0,
                    name.length + 1
                ) ===
                (name + "=")
            ) {

                cookieValue =
                    decodeURIComponent(
                        cookie.substring(
                            name.length + 1
                        )
                    );

                break;
            }
        }
    }


    return cookieValue;
}


const csrftoken =
    getCookie("csrftoken");


/* ==========================================================
   CREATE PAYPAL ORDER
========================================================== */

async function createPayPalOrder() {

    console.log(
        "===================================="
    );

    console.log(
        "PAYPAL CREATE ORDER START"
    );

    console.log(
        "===================================="
    );


    console.log(
        "Django Order ID:",
        djangoOrderId
    );


    console.log(
        "Create URL:",
        createUrl
    );


    try {

        const response =
            await fetch(
                createUrl,
                {

                    method: "POST",


                    credentials:
                        "same-origin",


                    headers: {

                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json",

                        "X-Requested-With":
                            "XMLHttpRequest",

                        ...(csrftoken
                            ? {
                                "X-CSRFToken":
                                    csrftoken
                            }
                            : {})
                    },


                    body:
                        JSON.stringify({

                            order_id:
                                djangoOrderId

                        })
                }
            );


        console.log(
            "CREATE HTTP STATUS:",
            response.status
        );


        console.log(
            "CREATE RESPONSE URL:",
            response.url
        );


        console.log(
            "CREATE REDIRECTED:",
            response.redirected
        );


        const contentType =
            response.headers.get(
                "content-type"
            ) || "";


        console.log(
            "CREATE CONTENT TYPE:",
            contentType
        );


        const text =
            await response.text();


        console.log(
            "CREATE RAW RESPONSE:",
            text
        );


        /* =================================================
           LOGIN REDIRECT
        ================================================== */

        if (response.redirected) {

            throw new Error(
                "Your login session has expired. " +
                "Please login again and retry payment."
            );
        }


        /* =================================================
           HTML RESPONSE
        ================================================== */

        if (
            !contentType.includes(
                "application/json"
            )
        ) {

            throw new Error(
                "Django returned HTML instead of JSON. " +
                "Check the create PayPal URL and Django server logs."
            );
        }


        /* =================================================
           JSON PARSE
        ================================================== */

        let data;


        try {

            data =
                JSON.parse(text);

        }
        catch (error) {

            throw new Error(
                "Django returned invalid JSON."
            );
        }


        console.log(
            "CREATE JSON:",
            data
        );


        /* =================================================
           BACKEND ERROR
        ================================================== */

        if (!response.ok) {

            let errorMessage =
                data.error ||
                data.message ||
                "Unable to create PayPal order.";


            if (data.details) {

                console.error(
                    "PAYPAL API DETAILS:",
                    data.details
                );


                if (
                    data.details.message
                ) {

                    errorMessage +=
                        " " +
                        data.details.message;
                }
            }


            throw new Error(
                errorMessage
            );
        }


        /* =================================================
           PAYPAL ORDER ID
        ================================================== */

        if (!data.id) {

            throw new Error(
                "PayPal Order ID was not returned by Django."
            );
        }


        console.log(
            "PAYPAL ORDER ID:",
            data.id
        );


        return data.id;

    }
    catch (error) {

        console.error(
            "CREATE PAYPAL ORDER ERROR:",
            error
        );


        showError(
            error.message
        );


        throw error;
    }
}



/* ==========================================================
   CAPTURE PAYPAL ORDER
========================================================== */

async function capturePayPalOrder(
    paypalOrderId
) {

    console.log(
        "===================================="
    );

    console.log(
        "PAYPAL CAPTURE START"
    );

    console.log(
        "===================================="
    );


    console.log(
        "PayPal Order ID:",
        paypalOrderId
    );


    try {


        /* =================================================
           BUILD CAPTURE URL
        ================================================== */

        const captureUrl =
            captureUrlTemplate.replace(
                "PAYPAL_ORDER_ID",
                encodeURIComponent(
                    paypalOrderId
                )
            );


        console.log(
            "Capture URL:",
            captureUrl
        );


        /* =================================================
           SEND CAPTURE REQUEST
        ================================================== */

        const response =
            await fetch(
                captureUrl,
                {

                    method: "POST",


                    credentials:
                        "same-origin",


                    headers: {

                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json",

                        "X-Requested-With":
                            "XMLHttpRequest",

                        ...(csrftoken
                            ? {
                                "X-CSRFToken":
                                    csrftoken
                            }
                            : {})
                    },


                    body:
                        JSON.stringify({

                            paypal_order_id:
                                paypalOrderId

                        })
                }
            );


        console.log(
            "CAPTURE HTTP STATUS:",
            response.status
        );


        console.log(
            "CAPTURE RESPONSE URL:",
            response.url
        );


        const contentType =
            response.headers.get(
                "content-type"
            ) || "";


        console.log(
            "CAPTURE CONTENT TYPE:",
            contentType
        );


        const text =
            await response.text();


        console.log(
            "CAPTURE RAW RESPONSE:",
            text
        );


        /* =================================================
           LOGIN REDIRECT
        ================================================== */

        if (response.redirected) {

            throw new Error(
                "Your login session has expired. " +
                "Please login again."
            );
        }


        /* =================================================
           HTML RESPONSE
        ================================================== */

        if (
            !contentType.includes(
                "application/json"
            )
        ) {

            throw new Error(
                "Django returned HTML instead of JSON during payment capture."
            );
        }


        /* =================================================
           PARSE JSON
        ================================================== */

        let result;


        try {

            result =
                JSON.parse(text);

        }
        catch (error) {

            throw new Error(
                "Django returned invalid JSON during payment capture."
            );
        }


        console.log(
            "CAPTURE JSON:",
            result
        );


        /* =================================================
           CAPTURE ERROR
        ================================================== */

        if (
            !response.ok ||
            !result.success
        ) {

            let message =
                result.error ||
                result.message ||
                "Payment capture failed.";


            if (result.details) {

                console.error(
                    "CAPTURE DETAILS:",
                    result.details
                );
            }


            throw new Error(
                message
            );
        }


        /* =================================================
           PAYMENT SUCCESS
        ================================================== */

        console.log(
            "PAYMENT COMPLETED SUCCESSFULLY"
        );


        if (
            result.redirect_url
        ) {

            window.location.href =
                result.redirect_url;

        }
        else {

            throw new Error(
                "Payment completed, but redirect URL was not returned."
            );
        }

    }
    catch (error) {

        console.error(
            "CAPTURE PAYPAL ORDER ERROR:",
            error
        );


        showError(
            error.message
        );
    }
}



/* ==========================================================
   CHECK PAYPAL SDK
========================================================== */

if (
    typeof paypal ===
    "undefined"
) {

    hideLoading();


    showError(
        "PayPal SDK failed to load. " +
        "Please check your PayPal Client ID and internet connection."
    );

}
else {


    console.log(
        "PayPal SDK loaded successfully."
    );


    /* ======================================================
       PAYPAL BUTTONS
    ======================================================= */

    paypal.Buttons({

        /* ==================================================
           CREATE ORDER
        =================================================== */

        createOrder:
            async function () {

                return await
                    createPayPalOrder();
            },


        /* ==================================================
           APPROVE
        =================================================== */

        onApprove:
            async function (data) {

                console.log(
                    "PAYPAL PAYMENT APPROVED:",
                    data
                );


                if (
                    !data ||
                    !data.orderID
                ) {

                    showError(
                        "PayPal Order ID was not received."
                    );

                    return;
                }


                await capturePayPalOrder(
                    data.orderID
                );
            },


        /* ==================================================
           CANCEL
        =================================================== */

        onCancel:
            function (data) {

                console.log(
                    "PAYPAL PAYMENT CANCELLED:",
                    data
                );


                showError(
                    "Payment was cancelled."
                );
            },


        /* ==================================================
           ERROR
        =================================================== */

        onError:
            function (error) {

                console.error(
                    "PAYPAL SDK ERROR:",
                    error
                );


                let message =
                    "PayPal payment error.";


                if (
                    error &&
                    error.message
                ) {

                    message +=
                        " " +
                        error.message;
                }


                showError(
                    message
                );
            }

    })


    /* ======================================================
       BUTTON RENDER SUCCESS
    ======================================================= */

    .render(
        "#paypal-button-container"
    )


    .then(
        function () {

            hideLoading();


            console.log(
                "===================================="
            );


            console.log(
                "PAYPAL BUTTON RENDERED SUCCESSFULLY"
            );


            console.log(
                "===================================="
            );
        }
    )


    /* ======================================================
       BUTTON RENDER ERROR
    ======================================================= */

    .catch(
        function (error) {

            hideLoading();


            console.error(
                "PAYPAL RENDER ERROR:",
                error
            );


            showError(
                error.message ||
                "Unable to load PayPal."
            );
        }
    );

}

</script>


</body>

</html>
